<div class="modal-header-custom">
  <h2>Concurso {{ concursoInfo.numero }}</h2>
</div>

<mat-dialog-content>
  <div class="dezenas-grid-dialog">
    <div *ngFor="let dezenaInfo of resultadoOrdenado" 
         class="dezena"
         [class.repetido]="dezenaInfo.isRepeated">
         {{ dezenaInfo.number | number:'2.0-0' }}
    </div>
  </div>

  <div class="stats-info">
    <strong>Paridade:</strong>
    <span class="highlight">{{ concursoInfo.impares }} Ímpares</span>
    <span style="color: #ccc">/</span>
    <span class="highlight">{{ concursoInfo.pares }} Pares</span>
    
    <span style="color: #ccc; margin-left: 8px; margin-right: 8px;">|</span>
    <strong>Repetidos:</strong>
    <span class="highlight">{{ concursoInfo.repetidos }}</span>
  </div>
</mat-dialog-content>

<mat-dialog-actions class="custom-dialog-actions">
  
  <div class="d-flex align-items-center gap-2">
    <span *ngIf="isGerado" class="obs-text">
      <mat-icon style="font-size: 16px; height: 16px; width: 16px;">warning</mat-icon>
      Simulação
    </span>

    <button *ngIf="isGerado" 
        mat-icon-button 
        color="primary" 
        title="Gerar outro palpite com os mesmos parâmetros" 
        (click)="recriarConcurso()"
        [disabled]="isLoading"
        class="refresh-btn">
      <mat-icon [class.icon-spin]="isLoading">loop</mat-icon>
    </button>
  </div>

  <div class="d-flex gap-2">
    <button *ngIf="isGerado" mat-raised-button color="accent" (click)="apostarConcurso()" [disabled]="isLoading">
      <mat-icon class="me-1">check_circle</mat-icon> Apostar
    </button>
    <button mat-stroked-button color="primary" mat-dialog-close>
      Fechar
    </button>
  </div>
</mat-dialog-actions>
