<h2 mat-dialog-title class="bg-light border-bottom d-flex align-items-center gap-2 m-0 py-3 px-4">
      <mat-icon color="primary">screen_share</mat-icon>
      Como extrair as leituras
    </h2>
    
    <mat-dialog-content class="pt-4 px-4 pb-3 text-center d-flex flex-column align-items-center">
      
      <!-- O GIF em destaque -->
      <img src="img/search-theme.gif"
           alt="Demonstração de como copiar as leituras" 
           class="img-fluid rounded shadow-sm border mb-4" 
           style="max-height: 350px; object-fit: contain;">

      <!-- Link direto para o site -->
      <p class="mb-2 text-muted">Acesse o site abaixo para encontrar o tema e copiar as leituras:</p>
      <a mat-flat-button color="accent" href="https://leondufour.com/" target="_blank" class="w-100 py-1">
        <mat-icon>open_in_new</mat-icon> Acessar leondufour.com
      </a>

    </mat-dialog-content>
    
    <mat-dialog-actions align="end" class="border-top pb-2 pt-2 pe-3">
      <button mat-button mat-dialog-close color="primary">Fechar</button>
    </mat-dialog-actions>
